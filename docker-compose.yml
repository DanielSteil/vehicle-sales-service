# Sobe só o serviço de venda e o banco dele, para desenvolvimento isolado.
# A plataforma completa (com o serviço principal) sobe pelo docker-compose do vehicle-core-service.
services:
  sales-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sales_db
      POSTGRES_USER: sales
      POSTGRES_PASSWORD: sales
    ports:
      - "15433:5432"
    volumes:
      - sales-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sales -d sales_db"]
      interval: 5s
      retries: 10

  sales-service:
    build: .
    depends_on:
      sales-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://sales-db:5432/sales_db
      DB_USERNAME: sales
      DB_PASSWORD: sales
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-local-internal-token}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-local-webhook-secret}
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 5s
      retries: 30

volumes:
  sales-db-data:
