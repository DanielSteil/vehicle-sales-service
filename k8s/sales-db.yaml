# Banco exclusivo do serviço de venda. Nenhum outro serviço acessa este PostgreSQL.
apiVersion: v1
kind: Service
metadata:
  name: sales-db
  labels:
    app: sales-db
spec:
  clusterIP: None
  selector:
    app: sales-db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sales-db
  labels:
    app: sales-db
spec:
  serviceName: sales-db
  replicas: 1
  selector:
    matchLabels:
      app: sales-db
  template:
    metadata:
      labels:
        app: sales-db
        app.kubernetes.io/part-of: vehicle-platform
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: sales_db
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: sales-db-credentials
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sales-db-credentials
                  key: password
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
